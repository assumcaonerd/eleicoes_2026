name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run test:map
      - uses: actions/upload-artifact@v4
        with:
          name: mapa-es-validacao-sintetica
          path: /tmp/siga-map-validation/
