services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eleicoes_2026
      POSTGRES_USER: eleicoes
      POSTGRES_PASSWORD: eleicoes
    ports:
      - "5432:5432"
    volumes:
      - eleicoes_pg:/var/lib/postgresql/data
  app:
    build: .
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
volumes:
  eleicoes_pg:
